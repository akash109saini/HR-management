name: Deploy React Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install & Build Frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          CI: false
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
      - name: Zip Build Files
        run: |
          cd frontend/build
          zip -r ../../build.zip .

      - name: Deploy Frontend via HTTPS
        run: |
          curl -f -X POST \
            -H "X-Deploy-Token: dmr_bh_deploy_token_2026_x87a912bf" \
            -F "file=@build.zip" \
            https://hr.dmrhospitals.com/deploy.php

