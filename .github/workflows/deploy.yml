name: Deploy React Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install & Build Frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          CI: false
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Find subdomain path and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            echo "=== Looking for hr subdomain path ==="
            find . -maxdepth 4 -type d -name "public_html" 2>/dev/null
            echo "=== Looking for hr directory ==="
            find . -maxdepth 4 -type d -iname "*hr*" 2>/dev/null
            echo "=== All domains ==="
            ls -la domains/ 2>/dev/null || echo "No domains dir"

      - name: Deploy to Hostinger via SFTP/SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          ARGS: "-rlgoDzvc --delete"
          SOURCE: "frontend/build/"
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: "domains/sairesidencyhostels.com/public_html/hr/"
          EXCLUDE: "/.htaccess"
