# ===========================================================
# MongoDB Production Configuration for HRMS
# Place at: /etc/mongod.conf  (or /etc/mongo/mongod.conf in Docker)
# ===========================================================

storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  verbosity: 0

net:
  port: 27017
  # IMPORTANT: For single-node prod inside a private VPC/Docker network use 0.0.0.0.
  # For a public-facing host bind ONLY to private/internal IPs.
  bindIp: 0.0.0.0
  maxIncomingConnections: 500
  tls:
    # OPTIONAL but recommended in prod. Uncomment after providing cert files.
    # mode: requireTLS
    # certificateKeyFile: /etc/mongo/certs/mongodb.pem
    # CAFile: /etc/mongo/certs/ca.pem
    disabledProtocols: TLS1_0,TLS1_1

processManagement:
  fork: false   # set to true when running as a system service (systemd)
  timeZoneInfo: /usr/share/zoneinfo

security:
  authorization: enabled
  # keyFile is REQUIRED for replica sets. Comment out for single-node.
  # keyFile: /etc/mongo/mongo-keyfile

# Uncomment to enable a replica set in production (recommended).
# replication:
#   replSetName: hrms-rs0

operationProfiling:
  slowOpThresholdMs: 200
  mode: slowOp
